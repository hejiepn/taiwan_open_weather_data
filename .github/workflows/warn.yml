name: Taiwan-Warnsystem

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (UTC; GitHub kann sich verspäten)
  workflow_dispatch:
    inputs:
      test_message:
        description: "Nur eine Test-Nachricht ans Handy senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: warnsystem
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Warnungen prüfen
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TEST_NOTIFY: ${{ inputs.test_message && '1' || '' }}
        run: python warn.py

      - name: state.json speichern (nur bei Änderung)
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || {
            git commit -m "state: update"
            git pull --rebase --quiet
            git push --quiet
          }
